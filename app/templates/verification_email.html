<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your account</title>
</head>
<body style="margin:0; padding:0; background-color:#0D0F0E; font-family: Georgia, 'Times New Roman', serif;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0D0F0E;">
    <tr>
      <td align="center" style="padding: 48px 16px;">

        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%;">

          <!-- Wordmark -->
          <tr>
            <td align="center" style="padding-bottom: 32px;">
              <span style="font-family: Georgia, 'Times New Roman', serif; font-size: 22px; color:#E7E8E3;">ClassLog</span>
            </td>
          </tr>

          <!-- Panel -->
          <tr>
            <td style="border: 1px solid #2A322D; padding: 40px 36px;">

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="font-family: Georgia, 'Times New Roman', serif; font-size: 26px; color:#E7E8E3; padding-bottom: 12px;">
                    Verify your account
                  </td>
                </tr>
                <tr>
                  <td align="center" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.6; color:#E7E8E3; opacity: 0.75; padding-bottom: 32px;">
                    Enter this code to finish signing in. It expires in 10 minutes.
                  </td>
                </tr>

                <!-- Code -->
                <tr>
                  <td align="center" style="padding-bottom: 32px;">
                    <table role="presentation" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="border: 1px solid #2A322D; padding: 18px 32px;">
                          <span style="font-family: Arial, Helvetica, sans-serif; font-size: 32px; font-weight: bold; letter-spacing: 10px; color:#B8C66A;">{{ code }}</span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <tr>
                  <td align="center" style="font-family: Arial, Helvetica, sans-serif; font-size: 13px; line-height: 1.6; color:#E7E8E3; opacity: 0.5;">
                    Didn't request this? You can safely ignore this email.
                  </td>
                </tr>

              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top: 28px; font-family: Arial, Helvetica, sans-serif; font-size: 12px; color:#E7E8E3; opacity: 0.4;">
              ClassLog &middot; sent to confirm a request on your account
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
